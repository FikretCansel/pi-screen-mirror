# Hedef konum: /etc/sysctl.d/90-tv-stream.conf
#
# UDP alim tamponunun ust siniri. Varsayilan deger 212992 (208 KB) idi ve
# ~3.6 Mbps'lik yayinda tampon tasip paket kaybina yol acti (netstat -su
# cikisinda "receive buffer errors" artiyordu). 16 MB'a cikarilinca kayip 0'a dustu.
#
# mpv'ye URL'de verilen buffer_size=8388608 degeri bu sinirla kisitlandigi icin
# bu dosya olmadan o ayar ise yaramaz.
net.core.rmem_max=16777216
